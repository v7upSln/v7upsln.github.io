<html lang="en">
<head>

    <meta property="og:title" content="v7upSln Repository">
    <meta property="og:description" content="iOS tweaks, utilities, and tools for jailbroken devices">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="assets/cursors.css">

    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/web/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/web/favicon-16x16.png">
    <link rel="manifest" href="assets/icons/web/site.webmanifest">
    <link rel="icon" href="assets/icons/web/favicon.ico">
</head>
<body>
    
    <div class="cursor-glow"></div>
    <div class="cursor-glow-secondary"></div>
    
    <main id="main-content">
        <div class="container">
            <div class="hero">
                <div class="logo">
                    <img src="https://avatars.githubusercontent.com/u/145231985?s=400&u=9801a3beb5dfb8c6ab78730acfa94be86f23dfb5&v=4" alt="v7upSln Repository Logo">
                </div>
                <h1>v7upSln Repository</h1>
                <p class="subtitle">iOS tweaks, utilities, tools.</p>
                
                <div class="repo-url">
                    https://v7upsln.github.io/
                </div>

                <div class="installers">
                    <a href="sileo://source/https://v7upsln.github.io/" class="btn btn-sileo">
                        <i class="fas fa-download"></i>
                        Add to Sileo
                    </a>
                    <a href="cydia://url/https://cydia.saurik.com/api/share#?source=https://v7upsln.github.io/" class="btn btn-cydia">
                        <i class="fas fa-download"></i>
                        Add to Cydia
                    </a>
                    <a href="zbra://sources/add/https://v7upsln.github.io/" class="btn btn-zebra">
                        <i class="fas fa-download"></i>
                        Add to Zebra
                    </a>
                </div>

                <a href="packages.html" class="btn btn-packages">
                    <i class="fas fa-box"></i>
                    Browse Available Packages
                </a>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            const isMobile = window.innerWidth <= 768;
            
            if (isTouchDevice || isMobile) {
                return;
            }
            
            const cursorGlow = document.querySelector('.cursor-glow');
            const cursorGlowSecondary = document.querySelector('.cursor-glow-secondary');
            
            let mouseX = 0, mouseY = 0;
            let glowX = 0, glowY = 0;
            let rafId = null;
            
            function updateGlow() {
                glowX += (mouseX - glowX) * 0.15;
                glowY += (mouseY - glowY) * 0.15;
                
                let glowSecondaryX = glowX;
                let glowSecondaryY = glowY;

                cursorGlow.style.left = `${glowX}px`;
                cursorGlow.style.top = `${glowY}px`;
                
                cursorGlowSecondary.style.left = `${glowSecondaryX}px`;
                cursorGlowSecondary.style.top = `${glowSecondaryY}px`;
                
                rafId = requestAnimationFrame(updateGlow);
            }
            
            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                
                if (!rafId) {
                    updateGlow();
                }
            });
            
            document.addEventListener('mouseenter', () => {
                cursorGlow.classList.add('active');
                cursorGlowSecondary.classList.add('active');
                
                if (!rafId) {
                    updateGlow();
                }
            });
            
            document.addEventListener('mouseleave', () => {
                cursorGlow.classList.remove('active');
                cursorGlowSecondary.classList.remove('active');
                
                if (rafId) {
                    cancelAnimationFrame(rafId);
                    rafId = null;
                }
            });
            
            window.addEventListener('beforeunload', () => {
                if (rafId) {
                    cancelAnimationFrame(rafId);
                }
            });
            
            if (document.hasFocus()) {
                cursorGlow.classList.add('active');
                cursorGlowSecondary.classList.add('active');
                updateGlow();
            }
        });
    </script>
</body>
</html>
