<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>v7upSln Repository</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="v7upSln Repository - iOS tweaks, utilities, and tools for jailbroken devices">
    <meta property="og:title" content="v7upSln Repository">
    <meta property="og:description" content="iOS tweaks, utilities, and tools for jailbroken devices">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href='assets/style.css'>
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <main id="main-content">
        <div class="container">
            <div class="hero">
                <div class="logo">
                    <img src="https://i.ibb.co/XkL9SRYM/145231985.png" alt="v7upSln Repository Logo">
                </div>
                <h1>v7upSln Repository</h1>
                <p class="subtitle">iOS tweaks, utilities, tools.</p>
                
                <div class="repo-url">
                    https://v7upsln.github.io/
                </div>

                <div class="installers">
                    <a href="sileo://source/https://v7upsln.github.io/" class="btn btn-sileo">
                        <i class="fas fa-download"></i>
                        Add to Sileo
                    </a>
                    <a href="cydia://url/https://cydia.saurik.com/api/share#?source=https://v7upsln.github.io/" class="btn btn-cydia">
                        <i class="fas fa-download"></i>
                        Add to Cydia
                    </a>
                    <a href="zbra://sources/add/https://v7upsln.github.io/" class="btn btn-zebra">
                        <i class="fas fa-download"></i>
                        Add to Zebra
                    </a>
                </div>

                <a href="packages.html" class="btn btn-packages">
                    <i class="fas fa-box"></i>
                    Browse Available Packages
                </a>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script>
        // Load footer content
        fetch('footer.html')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.text();
            })
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
            })
            .catch(error => {
                console.error('Error loading footer:', error);
                document.getElementById('footer-container').innerHTML = '<footer><p>Footer failed to load</p></footer>';
            });
    </script>
</body>
</html>
